<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0756b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حساب کالا">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>حساب کالا</title>
<style>
:root{--blue:#0756b8;--blue2:#0b72df;--green:#18a957;--red:#f04444;--orange:#f59a18;--purple:#7051d7;--teal:#0aa7a0;--bg:#f4f8fc;--text:#14233a;--muted:#7c8798}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}body{min-height:100vh}.app{max-width:720px;margin:auto;background:var(--bg);min-height:100vh;padding-bottom:82px}.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#064ca6,#0870da);height:255px;color:#fff;border-radius:0 0 34px 34px;box-shadow:0 8px 24px #0756b833}.hero:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-62px;height:110px;background:var(--bg);border-radius:50% 50% 0 0/80% 80% 0 0}.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0}.menu{font-size:28px;line-height:1}.mini-photo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #fff8;box-shadow:0 3px 12px #0003}.brand{position:relative;z-index:2;text-align:right;padding:10px 24px 0;min-height:165px}.brand img{position:absolute;right:22px;top:10px;width:115px;height:150px;object-fit:cover;object-position:center 25%;border-radius:0 0 58px 58px;filter:drop-shadow(0 8px 12px #0003);opacity:.98}.brand-text{position:relative;z-index:2;padding-top:42px;margin-right:95px;text-shadow:0 2px 5px #0003}.brand h1{font-size:30px;margin:0 0 6px;font-weight:800}.brand p{margin:0;font-size:14px;opacity:.95}.content{padding:0 14px}.summary{margin-top:-6px;position:relative;z-index:3;background:#fff;border-radius:22px;padding:12px 8px;box-shadow:0 5px 22px #152b4514;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.metric{text-align:center;border-left:1px solid #edf0f5}.metric:last-child{border-left:0}.metric .ico{width:38px;height:38px;border-radius:13px;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}.metric:nth-child(1) .ico{background:var(--green)}.metric:nth-child(2) .ico{background:#2777df}.metric:nth-child(3) .ico{background:var(--red)}.metric:nth-child(4) .ico{background:var(--orange)}.metric:nth-child(5) .ico{background:var(--purple)}.metric b{display:block;font-size:14px}.metric small{display:block;color:#667085;font-size:10px;margin-top:2px}.section-title{font-size:17px;font-weight:800;margin:20px 3px 10px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;text-align:right;background:#fff;border-radius:18px;padding:13px;min-height:88px;box-shadow:0 4px 15px #142b4610;display:flex;align-items:center;gap:10px;color:var(--text);cursor:pointer}.tile .ti{width:48px;height:48px;min-width:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:23px}.tile h3{font-size:15px;margin:0 0 4px}.tile p{font-size:10px;color:var(--muted);margin:0;line-height:1.6}.t1 .ti{background:#dff1ff;color:#1875d1}.t2 .ti{background:#dcf8e8;color:#12a052}.t3 .ti{background:#ffe5e7;color:#e33d49}.t4 .ti{background:#eee9ff;color:#6a4dd3}.t5 .ti{background:#fff0dd;color:#f08c00}.t6 .ti{background:#ddf8f5;color:#009f95}.backup-banner{margin-top:12px;background:linear-gradient(90deg,#e4f2ff,#d9ecff);border-radius:18px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer}.backup-banner .ti{width:44px;height:44px;border-radius:14px;background:#1976df;color:#fff;display:grid;place-items:center;font-size:21px}.backup-banner b{font-size:14px}.backup-banner small{display:block;color:#44729f;margin-top:3px;font-size:10px}.screen{display:none;padding:14px}.screen.active{display:block}.card{background:#fff;border-radius:20px;padding:15px;margin-bottom:11px;box-shadow:0 4px 15px #142b4610}.form-title{font-weight:800;font-size:18px;margin-bottom:12px}input,select{width:100%;border:1px solid #e0e6ef;border-radius:13px;padding:12px 13px;font-size:15px;margin:4px 0 9px;background:#fff;outline:none}input:focus,select:focus{border-color:#6aa8ec;box-shadow:0 0 0 3px #0b72df12}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer}.btn.secondary{background:#eef5ff;color:#0756b8}.btn.danger{background:#ffe8e8;color:#b42318}.back{border:0;background:transparent;font-size:14px;color:#0756b8;padding:2px 0 10px;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap}.empty{color:var(--muted);text-align:center;padding:20px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.report-box{background:#f7faff;border-radius:15px;padding:12px}.report-box span{font-size:11px;color:var(--muted)}.report-box b{display:block;font-size:17px;margin-top:4px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:74px;background:#fff;border-top:1px solid #e8edf3;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -5px 20px #0000000c}.bottom button{border:0;background:none;color:#718096;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}.bottom button .bi{font-size:22px;line-height:1}.bottom button.active{color:#0756b8;font-weight:800}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#15233a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){body{padding:12px}.app{border-radius:30px;overflow:hidden;box-shadow:0 10px 40px #10233a1a}.bottom{bottom:12px;border-radius:0 0 30px 30px}.hero{border-radius:0 0 34px 34px}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="topbar"><div class="menu">☰</div><img class="mini-photo" src="profile.jpg" alt="عکس صاحب برنامه"></div>
  <div class="brand"><img src="profile.jpg" alt="عکس شما"><div class="brand-text"><h1>حساب کالا</h1><p>مدیریت آسان خرید و فروش</p></div></div>
</header>
<main id="home" class="content screen active">
  <div class="summary">
    <div class="metric"><div class="ico">▣</div><b id="sales">۰</b><small>درآمد کل</small></div>
    <div class="metric"><div class="ico">🛒</div><b id="purchases">۰</b><small>خرید</small></div>
    <div class="metric"><div class="ico">◆</div><b id="salesCount">۰</b><small>فروش</small></div>
    <div class="metric"><div class="ico">▤</div><b id="exp">۰</b><small>مصارف</small></div>
    <div class="metric"><div class="ico">↗</div><b id="net">۰</b><small>سود خالص</small></div>
  </div>
  <div class="section-title">مدیریت حساب</div>
  <div class="tiles">
    <button class="tile t1" onclick="go('customer')"><div class="ti">👤</div><div><h3>مشتریان</h3><p>ثبت و مدیریت مشتریان</p></div></button>
    <button class="tile t2" onclick="go('buy')"><div class="ti">📦</div><div><h3>خرید کالا</h3><p>ثبت خرید و هزینه‌ها</p></div></button>
    <button class="tile t3" onclick="go('sell')"><div class="ti">🛒</div><div><h3>فروش کالا</h3><p>ثبت فروش نقدی و نسیه</p></div></button>
    <button class="tile t4" onclick="go('products')"><div class="ti">⬡</div><div><h3>کالاها</h3><p>مدیریت موجودی کالا</p></div></button>
    <button class="tile t5" onclick="go('report')"><div class="ti">▤</div><div><h3>گزارش‌ها</h3><p>گزارش روزانه و ماهانه</p></div></button>
    <button class="tile t6" onclick="go('expense')"><div class="ti">▣</div><div><h3>حساب‌ها</h3><p>طلب مشتری و مصارف</p></div></button>
  </div>
  <div class="backup-banner" onclick="go('backup')"><div class="ti">☁</div><div><b>پشتیبان‌گیری از اطلاعات</b><small>ذخیره و بازیابی اطلاعات برنامه</small></div><div style="margin-right:auto;font-size:22px">‹</div></div>
</main>
<section id="buy" class="screen"><button class="back" onclick="go('home')">‹ بازگشت به داشبورد</button><div class="card"><div class="form-title">ثبت خرید</div><input id="bn" placeholder="نام کالا"><div class="row"><input id="bq" type="number" placeholder="تعداد"><input id="bp" type="number" placeholder="قیمت خرید واحد"></div><input id="be" type="number" placeholder="کرایه و هزینه جانبی"><input id="bs" placeholder="فروشنده / تأمین‌کننده"><button class="btn" onclick="buy()">ثبت خرید</button></div></section>
<section id="sell" class="screen"><button class="back" onclick="go('home')">‹ بازگشت به داشبورد</button><div class="card"><div class="form-title">ثبت فروش</div><select id="sn"></select><div class="row"><input id="sq" type="number" placeholder="تعداد"><input id="sp" type="number" placeholder="قیمت فروش واحد"></div><select id="sm"><option value="cash">نقدی</option><option value="credit">نسیه</option></select><select id="sc"></select><button class="btn" onclick="sell()">ثبت فروش</button></div></section>
<section id="customer" class="screen"><button class="back" onclick="go('home')">‹ بازگشت به داشبورد</button><div class="card"><div class="form-title">ثبت مشتری</div><input id="cn" placeholder="نام مشتری"><input id="ct" placeholder="شماره تماس"><button class="btn" onclick="customer()">ثبت مشتری</button></div><div class="card"><div class="form-title">حساب مشتریان</div><div id="ctable"></div></div></section>
<section id="expense" class="screen"><button class="back" onclick="go('home')">‹ بازگشت به داشبورد</button><div class="card"><div class="form-title">ثبت مصرف</div><input id="en" placeholder="عنوان مصرف"><input id="ea" type="number" placeholder="مبلغ"><button class="btn" onclick="expense()">ثبت مصرف</button></div></section>
<section id="products" class="screen"><button class="back" onclick="go('home')">‹ بازگشت به داشبورد</button><div class="card"><div class="form-title">موجودی کالاها</div><div id="ptable"></div></div></section>
<section id="report" class="screen"><button class="back" onclick="go('home')">‹ بازگشت به داشبورد</button><div class="card"><div class="form-title">گزارش مالی</div><div id="reportbox" class="report-grid"></div></div></section>
<section id="backup" class="screen"><button class="back" onclick="go('home')">‹ بازگشت به داشبورد</button><div class="card"><div class="form-title">پشتیبان‌گیری</div><button class="btn" onclick="backup()">دانلود پشتیبان</button></div><div class="card"><input id="file" type="file" accept=".json"><button class="btn secondary" onclick="restore()">بازیابی اطلاعات</button></div><div class="card"><button class="btn danger" onclick="resetAll()">حذف همه اطلاعات</button></div></section>
<nav class="bottom">
<button id="nb-home" class="active" onclick="go('home')"><span class="bi">⌂</span>داشبورد</button>
<button id="nb-buy" onclick="go('buy')"><span class="bi">🛒</span>خرید</button>
<button id="nb-sell" onclick="go('sell')"><span class="bi">◇</span>فروش</button>
<button id="nb-expense" onclick="go('expense')"><span class="bi">▣</span>مصارف</button>
<button id="nb-products" onclick="go('products')"><span class="bi">⬡</span>کالاها</button>
</nav>
<div id="toast" class="toast"></div>
</div>
<script>
const K="hesab_kala_pro";
let d=JSON.parse(localStorage.getItem(K)||'{"products":{},"sales":[],"purchases":[],"expenses":[],"customers":[]}');
const fa=n=>Number(n||0).toLocaleString("fa-AF");
const M=n=>fa(n)+" افغانی";
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function save(){localStorage.setItem(K,JSON.stringify(d));render()}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));const b=document.getElementById('nb-'+id);if(b)b.classList.add('active');window.scrollTo(0,0);render()}
function buy(){let n=bn.value.trim(),q=+bq.value,p=+bp.value,e=+be.value||0;if(!n||q<=0||p<0)return toast('اطلاعات خرید را کامل کنید');let x=d.products[n]||{stock:0,cost:0,buy:0,sold:0},u=(q*p+e)/q;x.cost=x.stock?((x.stock*x.cost)+q*u)/(x.stock+q):u;x.stock+=q;x.buy+=q;d.products[n]=x;d.purchases.push({n,q,p,e,s:bs.value,date:Date.now()});bn.value=bq.value=bp.value=be.value=bs.value='';save();toast('خرید ثبت شد')}
function sell(){let n=sn.value,q=+sq.value,p=+sp.value;if(!n||q<=0||p<0)return toast('اطلاعات فروش را کامل کنید');let x=d.products[n];if(!x||x.stock<q)return toast('موجودی کافی نیست');x.stock-=q;x.sold+=q;d.sales.push({n,q,p,cost:x.cost,mode:sm.value,c:sc.value,date:Date.now()});if(sm.value==='credit'){let z=d.customers.find(y=>y.n===sc.value);if(z)z.balance+=q*p}save();toast('فروش ثبت شد')}
function customer(){let n=cn.value.trim();if(!n)return toast('نام مشتری را وارد کنید');if(!d.customers.some(x=>x.n===n))d.customers.push({n,t:ct.value,balance:0});cn.value=ct.value='';save();toast('مشتری ثبت شد')}
function expense(){let n=en.value.trim(),a=+ea.value;if(!n||a<=0)return toast('عنوان و مبلغ را وارد کنید');d.expenses.push({n,a,date:Date.now()});en.value=ea.value='';save();toast('مصرف ثبت شد')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='hesab-kala-backup.json';a.click();toast('فایل پشتیبان آماده شد')}
function restore(){let f=document.getElementById('file').files[0];if(!f)return toast('فایل را انتخاب کنید');let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();toast('بازیابی شد')}catch(e){toast('فایل نامعتبر است')}};r.readAsText(f)}
function resetAll(){if(confirm('همه اطلاعات حذف شود؟')){d={products:{},sales:[],purchases:[],expenses:[],customers:[]};save();toast('همه اطلاعات حذف شد')}}
function render(){let s=d.sales.reduce((a,x)=>a+x.q*x.p,0),g=d.sales.reduce((a,x)=>a+x.q*(x.p-x.cost),0),e=d.expenses.reduce((a,x)=>a+x.a,0),n=g-e,rec=d.customers.reduce((a,x)=>a+x.balance,0),v=Object.values(d.products).reduce((a,x)=>a+x.stock*x.cost,0),buyTotal=d.purchases.reduce((a,x)=>a+x.q*x.p+x.e,0);document.getElementById('sales').textContent=fa(s);document.getElementById('purchases').textContent=fa(buyTotal);document.getElementById('salesCount').textContent=fa(s);document.getElementById('exp').textContent=fa(e);document.getElementById('net').textContent=fa(n);document.getElementById('sn').innerHTML=Object.keys(d.products).map(x=>`<option>${x}</option>`).join('')||'<option>کالایی نیست</option>';document.getElementById('sc').innerHTML=d.customers.map(x=>`<option>${x.n}</option>`).join('')||'<option>مشتری نقدی</option>';document.getElementById('ctable').innerHTML=d.customers.length?`<div class="table-wrap"><table><tr><th>مشتری</th><th>شماره</th><th>طلب</th></tr>${d.customers.map(x=>`<tr><td>${x.n}</td><td>${x.t||'-'}</td><td>${M(x.balance)}</td></tr>`).join('')}</table></div>`:'<div class="empty">مشتری ثبت نشده است</div>';document.getElementById('ptable').innerHTML=Object.keys(d.products).length?`<div class="table-wrap"><table><tr><th>کالا</th><th>موجودی</th><th>قیمت تمام‌شده</th><th>ارزش</th></tr>${Object.entries(d.products).map(([name,x])=>`<tr><td>${name}</td><td>${fa(x.stock)}</td><td>${M(x.cost)}</td><td>${M(x.stock*x.cost)}</td></tr>`).join('')}</table></div>`:'<div class="empty">هنوز کالایی ثبت نشده است</div>';document.getElementById('reportbox').innerHTML=`<div class="report-box"><span>کل فروش</span><b>${M(s)}</b></div><div class="report-box"><span>خرید</span><b>${M(buyTotal)}</b></div><div class="report-box"><span>سود ناخالص</span><b>${M(g)}</b></div><div class="report-box"><span>مصارف</span><b>${M(e)}</b></div><div class="report-box"><span>سود خالص</span><b>${M(n)}</b></div><div class="report-box"><span>طلب مشتریان</span><b>${M(rec)}</b></div><div class="report-box"><span>ارزش موجودی</span><b>${M(v)}</b></div><div class="report-box"><span>تعداد کالا</span><b>${fa(Object.keys(d.products).length)}</b></div>`}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
</html>
